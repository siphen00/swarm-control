<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SWARM CONTROL</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<style>
  :root{
    --void:#05060D; --void2:#080B16; --panel:rgba(16,22,42,0.55); --panel-solid:#0C1120;
    --cyan:#29E7FF; --violet:#9B6BFF; --mint:#2FE68A; --red:#FF3D6E; --steel:#5D6B8C;
    --ink:#DDE6FF; --dim:#8A97BE; --faint:#4E5B7E;
    --line:rgba(90,130,220,0.16); --line-hot:rgba(41,231,255,0.4);
    --hud:"Chakra Petch",system-ui,sans-serif;
    --tel:"Share Tech Mono",ui-monospace,monospace;
    --glow-cyan:0 0 22px rgba(41,231,255,0.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--void); color:var(--ink); font-family:var(--hud);
    font-size:14px; line-height:1.4; overflow-x:hidden; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;color:inherit}
  ::selection{background:rgba(41,231,255,0.3)}

  /* background canvas + overlays */
  #bg{position:fixed;inset:0;z-index:0;display:block}
  .vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 30%,transparent 55%,rgba(3,4,10,0.85) 100%)}
  .scan{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,0.16) 2px 3px);
    mix-blend-mode:multiply}
  .app{position:relative;z-index:3}

  /* clipped HUD panel */
  .clip{clip-path:polygon(0 14px,14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%)}
  .panel{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(9px);position:relative}
  .panel::before{content:"";position:absolute;left:0;top:0;width:14px;height:1px;background:var(--line-hot);
    transform:rotate(-45deg);transform-origin:left top;box-shadow:var(--glow-cyan)}

  /* ---- top command bar ---- */
  .bar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgba(6,8,16,0.92),rgba(6,8,16,0.7));
    border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
  .bar-in{max-width:1280px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:11px}
  .glyph{width:22px;height:22px;position:relative;flex:none}
  .glyph::before,.glyph::after{content:"";position:absolute;inset:0;border:1.5px solid var(--cyan);border-radius:50%;
    opacity:.9;animation:spin 8s linear infinite}
  .glyph::after{inset:5px;border-color:var(--violet);animation-direction:reverse;animation-duration:5s}
  .glyph i{position:absolute;inset:9px;background:var(--cyan);border-radius:50%;box-shadow:var(--glow-cyan);animation:pulse 2s ease-in-out infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}
  .title{font-weight:700;letter-spacing:.34em;font-size:16px}
  .status-tag{font-family:var(--tel);font-size:11px;letter-spacing:.15em;color:var(--mint);
    display:flex;align-items:center;gap:6px}
  .status-tag .led{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint)}
  .grow{flex:1 1 auto}
  .readout{font-family:var(--tel);font-size:11px;letter-spacing:.08em;color:var(--dim);white-space:nowrap}
  .readout b{color:var(--cyan);font-weight:400}
  .hbtn{font-family:var(--tel);font-size:11px;letter-spacing:.12em;padding:8px 13px;border:1px solid var(--line);
    background:rgba(16,22,42,0.6);display:inline-flex;align-items:center;gap:8px;transition:.15s;text-transform:uppercase}
  .hbtn:hover{border-color:var(--line-hot);color:#fff;box-shadow:inset 0 0 12px rgba(41,231,255,0.12)}
  .hbtn svg{width:14px;height:14px}
  .hbtn.go{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 14px rgba(41,231,255,0.25)}
  .hbtn.go:hover{background:rgba(41,231,255,0.12)}
  .hbtn .live{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint)}
  .hbtn.paused .live{background:var(--faint);box-shadow:none}

  /* ---- layout ---- */
  .deck{max-width:1280px;margin:0 auto;padding:20px 22px 90px;display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
  @media(max-width:980px){.deck{grid-template-columns:1fr}}

  .col{display:flex;flex-direction:column;gap:18px;min-width:0}

  /* swarm hero */
  .hive{position:relative;height:480px;overflow:hidden}
  @media(max-width:980px){.hive{height:360px}}
  #swarm{position:absolute;inset:0;width:100%;height:100%;display:block}
  .hive-cap{position:absolute;top:14px;left:18px;z-index:2}
  .hive-cap .l1{font-family:var(--tel);font-size:11px;letter-spacing:.24em;color:var(--cyan)}
  .hive-cap .l2{font-family:var(--tel);font-size:10px;letter-spacing:.12em;color:var(--faint);margin-top:3px}
  .corner{position:absolute;z-index:2;font-family:var(--tel);font-size:11px;letter-spacing:.08em;color:var(--dim)}
  .corner b{font-size:22px;display:block;line-height:1;margin-top:2px;color:var(--ink)}
  .corner.tr{top:14px;right:18px;text-align:right}
  .corner.bl{bottom:16px;left:18px}
  .corner.br{bottom:16px;right:18px;text-align:right}
  .k-run{color:var(--cyan)} .k-q{color:var(--violet)} .k-ok{color:var(--mint)} .k-bad{color:var(--red)}

  /* gauges */
  .gauges{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .gauge{padding:12px 13px}
  .gauge .lab{font-family:var(--tel);font-size:10px;letter-spacing:.12em;color:var(--faint);display:flex;justify-content:space-between}
  .gauge .num{font-family:var(--hud);font-weight:600;font-size:26px;margin:6px 0 8px;font-variant-numeric:tabular-nums}
  .track{height:4px;background:rgba(255,255,255,0.06);position:relative;overflow:hidden}
  .track i{position:absolute;left:0;top:0;bottom:0;transition:width .6s cubic-bezier(.2,.7,.2,1)}
  .g-run i{background:var(--cyan);box-shadow:0 0 10px var(--cyan)} .g-run .num{color:var(--cyan)}
  .g-q i{background:var(--violet)} .g-q .num{color:var(--violet)}
  .g-ok i{background:var(--mint)} .g-ok .num{color:var(--mint)}
  .g-bad i{background:var(--red)} .g-bad .num{color:var(--red)}
  .g-idle i{background:var(--steel)} .g-idle .num{color:var(--dim)}

  /* feed */
  .feed-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:13px 16px}
  .feed-title{font-family:var(--tel);font-size:11px;letter-spacing:.22em;color:var(--cyan);margin-right:4px}
  .flt{font-family:var(--tel);font-size:10px;letter-spacing:.08em;padding:5px 10px;border:1px solid var(--line);
    background:transparent;color:var(--dim);text-transform:uppercase;transition:.14s}
  .flt[aria-pressed="true"]{color:var(--ink);border-color:var(--line-hot);box-shadow:inset 0 0 10px rgba(41,231,255,0.1)}
  .flt .d{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .find{margin-left:auto;flex:1;min-width:120px;background:rgba(8,11,22,0.7);border:1px solid var(--line);
    padding:7px 11px;color:var(--ink);font-family:var(--tel);font-size:12px}
  .find:focus{outline:none;border-color:var(--line-hot)}
  .find::placeholder{color:var(--faint)}

  .feed{display:flex;flex-direction:column;gap:10px;max-height:none}

  .swarm-block{border:1px solid var(--line);background:rgba(10,14,28,0.5)}
  .swarm-block .sb-head{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);
    font-family:var(--tel);font-size:12px;letter-spacing:.04em}
  .sb-head .owner{color:var(--faint)} .sb-head .repo{color:var(--ink)}
  .sb-head .pips{display:flex;gap:4px;margin-left:4px}
  .sb-head .pip{width:6px;height:6px;border-radius:50%}
  .sb-head .grow{flex:1}
  .sb-head .err{color:var(--red);font-size:10px}

  .run{position:relative;display:grid;grid-template-columns:8px 104px 1fr auto;gap:12px;align-items:center;
    padding:11px 14px 11px 0;border-top:1px solid rgba(90,130,220,0.08);transition:background .12s}
  .run:first-child{border-top:none}
  .run:hover{background:rgba(41,231,255,0.04)}
  .run.flash{animation:flash 1.1s ease}
  @keyframes flash{0%{background:rgba(41,231,255,0.25)}100%{background:transparent}}
  .rail{align-self:stretch;width:3px;margin-left:0}
  .r-running .rail{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
  .r-queued .rail{background:var(--violet)}
  .r-success .rail{background:var(--mint)}
  .r-failure .rail{background:var(--red);box-shadow:0 0 8px rgba(255,61,110,.5)}
  .r-cancelled .rail,.r-other .rail{background:var(--steel)}

  .pill{font-family:var(--tel);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .pill .d{width:7px;height:7px;border-radius:50%;flex:none}
  .r-running .pill{color:var(--cyan)} .r-running .pill .d{background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:pulse 1.4s infinite}
  .r-queued .pill{color:var(--violet)} .r-queued .pill .d{background:var(--violet)}
  .r-success .pill{color:var(--mint)} .r-success .pill .d{background:var(--mint)}
  .r-failure .pill{color:var(--red)} .r-failure .pill .d{background:var(--red)}
  .r-cancelled .pill,.r-other .pill{color:var(--steel)} .r-cancelled .pill .d,.r-other .pill .d{background:var(--steel)}

  .rmain{min-width:0}
  .rmain .wf{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px}
  .rmain .wf .n{font-family:var(--tel);font-size:11px;color:var(--faint)}
  .rmain .t{color:var(--dim);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rmain .meta{font-family:var(--tel);font-size:10px;color:var(--faint);letter-spacing:.04em;margin-top:3px}
  .racts{display:flex;align-items:center;gap:6px}
  .iico{width:30px;height:30px;border:1px solid var(--line);background:rgba(8,11,22,0.6);color:var(--dim);
    display:inline-flex;align-items:center;justify-content:center;transition:.13s}
  .iico:hover{color:var(--cyan);border-color:var(--line-hot)}
  .iico.stop:hover{color:var(--red);border-color:var(--red)}
  .iico svg{width:15px;height:15px}
  .dur{font-family:var(--tel);font-size:12px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums;min-width:56px}
  .dur .rel{font-size:10px;color:var(--faint);margin-top:2px}

  .jobs{grid-column:1/-1;padding:8px 0 2px 20px;border-top:1px dashed var(--line);margin-top:8px}
  .job{font-family:var(--tel);font-size:12px;padding:3px 0;display:flex;gap:9px;align-items:center}
  .steps{margin:1px 0 7px 16px}
  .step{font-family:var(--tel);font-size:11px;color:var(--faint);padding:1px 0;display:flex;gap:8px}
  .step .m{width:12px;text-align:center}

  .banner{margin:0 0 4px;padding:9px 14px;font-family:var(--tel);font-size:11px;letter-spacing:.04em;
    color:var(--cyan);border:1px solid var(--line-hot);background:rgba(41,231,255,0.06)}
  .empty{padding:40px;text-align:center;border:1px solid var(--line);background:rgba(10,14,28,0.5)}
  .empty h3{font-weight:600;margin:0 0 6px} .empty p{color:var(--dim);margin:0}

  .skeleton{height:60px;border:1px solid var(--line);background:linear-gradient(90deg,rgba(16,22,42,.4) 25%,rgba(30,40,70,.5) 50%,rgba(16,22,42,.4) 75%);
    background-size:200% 100%;animation:sh 1.3s infinite}
  @keyframes sh{to{background-position:-200% 0}}

  /* launch drawer */
  .scrim{position:fixed;inset:0;background:rgba(3,5,12,0.6);backdrop-filter:blur(3px);z-index:60;opacity:0;pointer-events:none;transition:.2s}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:430px;max-width:92vw;z-index:70;
    background:linear-gradient(180deg,#0A0E1C,#070A14);border-left:1px solid var(--line-hot);
    transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;
    box-shadow:-20px 0 60px rgba(0,0,0,0.5)}
  .drawer.open{transform:none}
  .dhead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .dhead h3{font-weight:600;margin:0;font-size:15px;letter-spacing:.1em}
  .dhead .tel{font-family:var(--tel);font-size:10px;color:var(--cyan);letter-spacing:.2em}
  .dbody{padding:20px;display:flex;flex-direction:column;gap:16px;overflow:auto}
  .field label{font-family:var(--tel);font-size:10px;letter-spacing:.14em;color:var(--faint);display:block;margin-bottom:7px;text-transform:uppercase}
  .field select,.field input,.field textarea{width:100%;background:rgba(8,11,22,0.8);border:1px solid var(--line);
    padding:10px 12px;color:var(--ink);font-family:var(--tel);font-size:12.5px}
  .field textarea{min-height:92px;resize:vertical}
  .field select:focus,.field input:focus,.field textarea:focus{outline:none;border-color:var(--line-hot)}
  .hint{font-family:var(--tel);font-size:10.5px;color:var(--faint);margin-top:6px}
  .hint code{color:var(--cyan)}
  .dfoot{margin-top:auto;padding:16px 20px;border-top:1px solid var(--line);display:flex;gap:10px}
  .dfoot .hbtn{flex:1;justify-content:center}

  .toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{font-family:var(--tel);font-size:12px;padding:10px 16px;border:1px solid var(--line-hot);
    background:rgba(10,14,28,0.95);box-shadow:0 0 30px rgba(41,231,255,0.15);animation:tr .2s}
  .toast.err{border-color:var(--red);color:#FFAFC0}
  .toast.ok{border-color:var(--mint);color:#9FF3CE}
  @keyframes tr{from{opacity:0;transform:translateY(6px)}}

  /* boot */
  #boot{position:fixed;inset:0;z-index:120;background:var(--void);display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:16px;transition:opacity .5s}
  #boot.done{opacity:0;pointer-events:none}
  #boot .bg-glyph{width:60px;height:60px;position:relative}
  #boot .bg-glyph::before,#boot .bg-glyph::after{content:"";position:absolute;inset:0;border:2px solid var(--cyan);border-radius:50%;animation:spin 2s linear infinite}
  #boot .bg-glyph::after{inset:12px;border-color:var(--violet);animation-direction:reverse}
  #boot .bt{font-family:var(--tel);font-size:12px;letter-spacing:.3em;color:var(--cyan)}
  #boot .bp{width:220px;height:2px;background:rgba(255,255,255,0.08);overflow:hidden}
  #boot .bp i{display:block;height:100%;width:0;background:var(--cyan);box-shadow:var(--glow-cyan);animation:load 1s ease forwards}
  @keyframes load{to{width:100%}}

  .enter{opacity:0;animation:enter .6s ease forwards}
  @keyframes enter{to{opacity:1}}

  /* failure alert flash + toggle states */
  .alertflash{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:0;
    box-shadow:inset 0 0 180px rgba(255,61,110,0.6),inset 0 0 40px rgba(255,61,110,0.4);transition:opacity .12s}
  .alertflash.on{opacity:1}
  .hbtn.muted{opacity:.55}
  .hbtn.on{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 14px rgba(41,231,255,0.25)}

  /* war room mode — swarm takes the whole screen */
  body.warroom{overflow:hidden}
  body.warroom .deck{grid-template-columns:1fr;padding:12px 22px}
  body.warroom .col:last-child{display:none}
  body.warroom .gauges{display:none}
  body.warroom .hive{height:calc(100vh - 96px)}
  body.warroom .hive-cap .l1{font-size:14px}
  body.warroom .hive-cap .l2{font-size:12px}
  body.warroom .corner{font-size:13px}
  body.warroom .corner b{font-size:40px}

  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media(max-width:560px){
    .gauges{grid-template-columns:repeat(3,1fr)}
    .run{grid-template-columns:8px 92px 1fr auto}
    .rmain .t,.rmain .meta{display:none}
    .title{letter-spacing:.2em;font-size:14px}
  }
</style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="vignette"></div>
  <div class="scan"></div>
  <div class="alertflash" id="alertFlash"></div>

  <div id="boot">
    <div class="bg-glyph"></div>
    <div class="bt" id="bootTxt">INITIALIZING SWARM</div>
    <div class="bp"><i></i></div>
  </div>

  <div class="app">
    <header class="bar">
      <div class="bar-in">
        <div class="logo">
          <span class="glyph"><i></i></span>
          <span class="title">SWARM CONTROL</span>
          <span class="status-tag"><span class="led"></span><span id="sysStat">SYSTEM ONLINE</span></span>
        </div>
        <div class="grow"></div>
        <span class="readout" id="clock">--:--:--</span>
        <span class="readout">UPLINK <b id="rate">----</b></span>
        <button class="hbtn paused" id="autoBtn"><span class="live"></span><span id="autoLbl">LIVE·20s</span></button>
        <button class="hbtn" id="muteBtn" title="Sound"><svg id="muteIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg></button>
        <button class="hbtn" id="warBtn" title="War room"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
        <button class="hbtn" id="refreshBtn" title="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
        <button class="hbtn go" id="launchBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>LAUNCH</button>
      </div>
    </header>

    <div class="deck">
      <!-- LEFT: swarm hero + gauges -->
      <div class="col">
        <div class="panel clip hive enter">
          <canvas id="swarm"></canvas>
          <div class="hive-cap">
            <div class="l1">◈ HIVE CORE</div>
            <div class="l2" id="hiveSub">TRACKING 0 AGENTS</div>
          </div>
          <div class="corner tr"><span class="k-run">ACTIVE</span><b id="cActive">0</b></div>
          <div class="corner bl"><span class="k-q">QUEUED</span> <b id="cQueued">0</b></div>
          <div class="corner br"><span class="k-bad">FAILED</span><b id="cFailed">0</b></div>
        </div>

        <div class="gauges">
          <div class="panel clip gauge g-run"><div class="lab"><span>RUNNING</span></div><div class="num" id="gRun">0</div><div class="track"><i id="gRunBar"></i></div></div>
          <div class="panel clip gauge g-q"><div class="lab"><span>QUEUED</span></div><div class="num" id="gQ">0</div><div class="track"><i id="gQBar"></i></div></div>
          <div class="panel clip gauge g-ok"><div class="lab"><span>PASSED</span></div><div class="num" id="gOk">0</div><div class="track"><i id="gOkBar"></i></div></div>
          <div class="panel clip gauge g-bad"><div class="lab"><span>FAILED</span></div><div class="num" id="gBad">0</div><div class="track"><i id="gBadBar"></i></div></div>
          <div class="panel clip gauge g-idle"><div class="lab"><span>IDLE</span></div><div class="num" id="gIdle">0</div><div class="track"><i id="gIdleBar"></i></div></div>
        </div>
      </div>

      <!-- RIGHT: telemetry feed -->
      <div class="col">
        <div class="panel clip">
          <div class="feed-head">
            <span class="feed-title">◤ LIVE FEED</span>
            <button class="flt" data-f="all" aria-pressed="true">All</button>
            <button class="flt" data-f="running" aria-pressed="false"><span class="d" style="background:var(--cyan)"></span>Run</button>
            <button class="flt" data-f="queued" aria-pressed="false"><span class="d" style="background:var(--violet)"></span>Queue</button>
            <button class="flt" data-f="failure" aria-pressed="false"><span class="d" style="background:var(--red)"></span>Fail</button>
            <button class="flt" data-f="success" aria-pressed="false"><span class="d" style="background:var(--mint)"></span>Pass</button>
            <input class="find" id="find" placeholder="filter…" autocomplete="off"/>
          </div>
        </div>
        <div id="banner"></div>
        <div class="feed" id="feed">
          <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- launch drawer -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="dhead"><span class="tel">▲</span><h3>LAUNCH RUN</h3><div class="grow" style="flex:1"></div>
      <button class="iico" id="dClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="dbody">
      <div class="field"><label>Swarm / repo</label><select id="dRepo"></select></div>
      <div class="field"><label>Workflow</label><select id="dWorkflow"><option value="">select a repo…</option></select>
        <div class="hint">Launchable only if its YAML has <code>on: workflow_dispatch</code>.</div></div>
      <div class="field"><label>Ref (branch / tag)</label><input id="dRef" placeholder="main"/></div>
      <div class="field"><label>Inputs · JSON (optional)</label><textarea id="dInputs" spellcheck="false" placeholder='{ "reason": "manual run" }'></textarea></div>
    </div>
    <div class="dfoot"><button class="hbtn" id="dCancel">Cancel</button><button class="hbtn go" id="dRun">Run workflow</button></div>
  </aside>

  <div class="toasts" id="toasts"></div>

<script>
(() => {
  "use strict";
  const $ = (s,r=document)=>r.querySelector(s);
  const RM = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const KEY="swarm.key";
  const state={data:null,filter:"all",q:"",auto:true,ms:20000,expanded:new Set(),demo:false};
  let poll=null;

  /* ---------- auth + api (unchanged contract) ---------- */
  const getKey=()=>sessionStorage.getItem(KEY)||"";
  const setKey=k=>sessionStorage.setItem(KEY,k);
  const authHeaders=()=>{const k=getKey();return k?{"x-dashboard-key":k}:{};};
  async function api(path,opts={}){
    const res=await fetch(path,{...opts,headers:{...(opts.headers||{}),...authHeaders(),...(opts.body?{"Content-Type":"application/json"}:{})}});
    let b=null; try{b=await res.json();}catch{}
    if(res.status===401){const k=window.prompt("Dashboard key:");if(k){setKey(k);return api(path,opts);}throw new Error("Locked.");}
    if(!res.ok)throw new Error((b&&b.error)||("HTTP "+res.status));
    return b;
  }

  /* ---------- time ---------- */
  function rel(iso){if(!iso)return"";let s=Math.floor((Date.now()-new Date(iso))/1000);
    if(s<60)return s+"s";let m=Math.floor(s/60);if(m<60)return m+"m";let h=Math.floor(m/60);if(h<24)return h+"h";return Math.floor(h/24)+"d";}
  function durTxt(a,b){if(!a)return"";const e=b?new Date(b).getTime():Date.now();let s=Math.max(0,Math.floor((e-new Date(a).getTime())/1000));
    const m=Math.floor(s/60);s%=60;if(m>=60){const h=Math.floor(m/60);return h+"h "+(m%60)+"m";}return m?m+"m "+s+"s":s+"s";}
  const STATES=["running","queued","success","failure","cancelled","other"];
  const LBL={running:"Running",queued:"Queued",success:"Passed",failure:"Failed",cancelled:"Cancelled",other:"Done"};
  const COL={running:"#29E7FF",queued:"#9B6BFF",success:"#2FE68A",failure:"#FF3D6E",cancelled:"#5D6B8C",other:"#5D6B8C"};
  const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  /* ============================================================
     AUDIO — synthesized SFX (no files). Unlocks on first gesture.
     ============================================================ */
  let actx=null, muted=false;
  function ensureAudio(){ if(!actx){ try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch{} } if(actx&&actx.state==="suspended")actx.resume(); }
  function tone({freq=440,to=null,dur=0.15,type="sine",gain=0.12,delay=0}){
    if(!actx||muted)return; const t0=actx.currentTime+delay;
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,t0);
    if(to)o.frequency.exponentialRampToValueAtTime(Math.max(1,to),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(gain,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g).connect(actx.destination);o.start(t0);o.stop(t0+dur+0.03);
  }
  const sfxLaunch =()=>{tone({freq:200,to:900,dur:0.34,type:"sawtooth",gain:0.10});tone({freq:420,to:1400,dur:0.30,type:"sine",gain:0.05,delay:0.02});};
  const sfxFail   =()=>{tone({freq:320,to:110,dur:0.5,type:"square",gain:0.12});tone({freq:150,to:70,dur:0.55,type:"square",gain:0.07,delay:0.14});};
  const sfxRunning=()=>{tone({freq:820,to:1180,dur:0.07,type:"sine",gain:0.045});};
  const sfxDone   =()=>{tone({freq:600,to:960,dur:0.11,type:"sine",gain:0.05});};
  const sfxCancel =()=>{tone({freq:300,to:180,dur:0.12,type:"triangle",gain:0.06});};

  /* failure reaction: red flare + shockwave + screen flash */
  function triggerAlert(){
    coreAlert=1; shockwaves.push({r:26,life:1});
    const f=$("#alertFlash"); if(f){f.classList.add("on"); setTimeout(()=>f.classList.remove("on"),140);}
  }
  function lerpCol(a,b,t){return a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(",");}

  /* compare each poll to the last, fire sfx + alert on transitions */
  const prevStates=new Map(); let baseline=false;
  function detectEvents(d){
    let newFail=false,newRun=false,newDone=false;
    for(const run of (d.runs||[])){
      const prev=prevStates.get(run.id);
      if(baseline && prev!==run.state){
        if(run.state==="failure")newFail=true;
        else if(run.state==="running")newRun=true;
        else if(run.state==="success")newDone=true;
      }
      if(baseline && prev===undefined && run.state==="failure")newFail=true;
      prevStates.set(run.id,run.state);
    }
    baseline=true;
    if(newFail){sfxFail();triggerAlert();}
    else if(newRun)sfxRunning();
    else if(newDone)sfxDone();
  }

  /* ============================================================
     BACKGROUND CANVAS — drifting starfield + grid + nebula
     ============================================================ */
  const bg=$("#bg"),bx=bg.getContext("2d");
  let stars=[],neb=[],W=0,H=0,DPR=Math.min(devicePixelRatio||1,2);
  function sizeBg(){W=innerWidth;H=innerHeight;bg.width=W*DPR;bg.height=H*DPR;bg.style.width=W+"px";bg.style.height=H+"px";bx.setTransform(DPR,0,0,DPR,0,0);
    stars=Array.from({length:Math.min(180,Math.floor(W*H/9000))},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*.8+.2,tw:Math.random()*6.28}));
    neb=[{x:W*.2,y:H*.3,c:"41,231,255"},{x:W*.8,y:H*.2,c:"155,107,255"},{x:W*.6,y:H*.85,c:"47,230,138"}];}
  function drawBg(t){
    bx.clearRect(0,0,W,H);
    // nebula
    for(let i=0;i<neb.length;i++){const n=neb[i];const dx=Math.sin(t/9000+i)*40,dy=Math.cos(t/11000+i)*40;
      const g=bx.createRadialGradient(n.x+dx,n.y+dy,0,n.x+dx,n.y+dy,Math.max(W,H)*.5);
      g.addColorStop(0,`rgba(${n.c},0.08)`);g.addColorStop(1,"rgba(0,0,0,0)");bx.fillStyle=g;bx.fillRect(0,0,W,H);}
    // grid
    const gs=64,off=(t/90)%gs;bx.strokeStyle="rgba(90,130,220,0.05)";bx.lineWidth=1;bx.beginPath();
    for(let x=-off;x<W;x+=gs){bx.moveTo(x,0);bx.lineTo(x,H);}for(let y=-off;y<H;y+=gs){bx.moveTo(0,y);bx.lineTo(W,y);}bx.stroke();
    // stars
    for(const s of stars){s.y+=s.z*0.15;if(s.y>H)s.y=0;const a=0.4+0.6*Math.abs(Math.sin(t/1000*s.z+s.tw));
      bx.fillStyle=`rgba(200,225,255,${a*s.z})`;bx.fillRect(s.x,s.y,s.z*1.6,s.z*1.6);}
  }

  /* ============================================================
     SWARM CANVAS — hive core + orbiting agent nodes
     ============================================================ */
  const sc=$("#swarm"),sx=sc.getContext("2d");
  let sw=0,sh=0,nodes=new Map(),parts=[],hover=null,mouse={x:-999,y:-999},shockwaves=[],coreAlert=0;
  function sizeSwarm(){const r=sc.getBoundingClientRect();sw=r.width;sh=r.height;sc.width=sw*DPR;sc.height=sh*DPR;sx.setTransform(DPR,0,0,DPR,0,0);}
  function hash(id){let h=0,s=String(id);for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
  function ringFor(st){return st==="running"?0.30:st==="queued"?0.52:0.76;}
  function syncNodes(){
    if(!state.data)return;
    const runs=(state.data.runs||[]).slice(0,44);
    const seen=new Set();
    for(const run of runs){
      seen.add(run.id);
      let n=nodes.get(run.id);
      const h=hash(run.id);
      const ang=(h%360)*Math.PI/180;
      if(!n){n={ang,spin:(h%2?1:-1)*(0.02+(h%7)/900),jr:(h%18)/2,jp:h%628/100,x:sw/2+Math.cos(ang)*sw,y:sh/2+Math.sin(ang)*sh};nodes.set(run.id,n);}
      n.run=run;n.state=run.state;n.ringF=ringFor(run.state);n.col=COL[run.state];
      n.match=passFilter(run);
    }
    for(const id of[...nodes.keys()])if(!seen.has(id))nodes.delete(id);
  }
  function drawSwarm(t){
    sx.clearRect(0,0,sw,sh);
    const cx=sw/2,cy=sh/2,R=Math.min(sw,sh)/2-26;
    // core (reacts to failures: flares red + spins up)
    coreAlert=Math.max(0,coreAlert-0.006);
    const alert=coreAlert;
    const cc=lerpCol([41,231,255],[255,61,110],alert);
    const pulse=0.5+0.5*Math.sin(t/(700-alert*430));
    // spinning tick ring — speeds up under alert
    const spin=t/1000*(0.4+alert*3.2);
    sx.save();sx.translate(cx,cy);sx.rotate(spin);
    for(let i=0;i<24;i++){const a=i/24*6.283,r1=33,r2=40+(i%2?3:0);
      sx.strokeStyle=`rgba(${cc},${0.14+0.3*alert})`;sx.lineWidth=1;
      sx.beginPath();sx.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);sx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);sx.stroke();}
    sx.restore();
    for(let i=3;i>=1;i--){sx.beginPath();sx.arc(cx,cy,10*i+pulse*4,0,6.283);
      sx.strokeStyle=`rgba(${cc},${0.10*i})`;sx.lineWidth=1.5;sx.stroke();}
    const cr=26+alert*12;
    const cg=sx.createRadialGradient(cx,cy,0,cx,cy,cr);cg.addColorStop(0,`rgba(${cc},0.92)`);cg.addColorStop(1,`rgba(${cc},0)`);
    sx.fillStyle=cg;sx.beginPath();sx.arc(cx,cy,cr,0,6.283);sx.fill();
    sx.fillStyle="#fff";sx.beginPath();sx.arc(cx,cy,4,0,6.283);sx.fill();
    // shockwaves from a failure
    for(let i=shockwaves.length-1;i>=0;i--){const s=shockwaves[i];s.r+=4.2;s.life-=0.02;
      if(s.life<=0){shockwaves.splice(i,1);continue;}
      sx.strokeStyle=`rgba(255,61,110,${s.life*0.5})`;sx.lineWidth=2;sx.beginPath();sx.arc(cx,cy,s.r,0,6.283);sx.stroke();}

    // update node positions
    const list=[...nodes.values()];
    for(const n of list){
      if(!RM)n.ang+=n.spin;
      const rr=R*n.ringF+Math.sin(t/800+n.jp)*n.jr;
      const tx=cx+Math.cos(n.ang)*rr, ty=cy+Math.sin(n.ang)*rr;
      n.x+=(tx-n.x)*0.06; n.y+=(ty-n.y)*0.06;
    }
    // mesh between running nodes
    const runNodes=list.filter(n=>n.state==="running"&&n.match);
    sx.lineWidth=1;
    for(let i=0;i<runNodes.length;i++){
      const a=runNodes[i];
      // link to core
      sx.strokeStyle=`rgba(41,231,255,${0.12+0.1*pulse})`;sx.beginPath();sx.moveTo(a.x,a.y);sx.lineTo(cx,cy);sx.stroke();
      for(let j=i+1;j<runNodes.length;j++){const b=runNodes[j];const d=Math.hypot(a.x-b.x,a.y-b.y);
        if(d<130){sx.strokeStyle=`rgba(41,231,255,${0.14*(1-d/130)})`;sx.beginPath();sx.moveTo(a.x,a.y);sx.lineTo(b.x,b.y);sx.stroke();}}
      if(!RM&&Math.random()<0.25)parts.push({x:a.x,y:a.y,vx:(Math.random()-.5)*.6,vy:(Math.random()-.5)*.6,life:1,col:a.col});
    }
    // particles
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.life-=0.02;if(p.life<=0){parts.splice(i,1);continue;}
      sx.globalAlpha=p.life*0.7;sx.fillStyle=p.col;sx.fillRect(p.x,p.y,1.6,1.6);}
    sx.globalAlpha=1;

    // nodes
    hover=null;
    for(const n of list){
      const active=n.state==="running";
      const base=active?5.5:n.state==="queued"?4.5:3.5;
      const rad=base+(active?Math.sin(t/300+n.jp)*1.5:0);
      const a=n.match?1:0.18;
      const dh=Math.hypot(mouse.x-n.x,mouse.y-n.y);if(dh<12&&n.match)hover=n;
      // glow
      const g=sx.createRadialGradient(n.x,n.y,0,n.x,n.y,rad*3.2);
      g.addColorStop(0,hexA(n.col,0.55*a));g.addColorStop(1,hexA(n.col,0));
      sx.fillStyle=g;sx.beginPath();sx.arc(n.x,n.y,rad*3.2,0,6.283);sx.fill();
      // dot
      sx.globalAlpha=a;sx.fillStyle=n.col;sx.beginPath();sx.arc(n.x,n.y,rad,0,6.283);sx.fill();
      if(active){sx.strokeStyle=hexA("#ffffff",0.6*a);sx.lineWidth=1;sx.beginPath();sx.arc(n.x,n.y,rad+2,0,6.283);sx.stroke();}
      sx.globalAlpha=1;
    }
    // hover label
    if(hover){const r=hover.run;const label=r.repo.split("/")[1]+" · "+r.workflow+" #"+r.number;
      sx.font="11px 'Share Tech Mono',monospace";const w=sx.measureText(label).width+16;
      let lx=hover.x+12,ly=hover.y-10;if(lx+w>sw)lx=hover.x-12-w;
      sx.fillStyle="rgba(6,9,18,0.92)";sx.strokeStyle=hexA(hover.col,0.6);sx.lineWidth=1;
      sx.fillRect(lx,ly-14,w,20);sx.strokeRect(lx,ly-14,w,20);
      sx.fillStyle="#DDE6FF";sx.fillText(label,lx+8,ly);sc.style.cursor="pointer";}
    else sc.style.cursor="default";
  }
  function hexA(hex,a){if(hex[0]!=="#")return hex;const n=parseInt(hex.slice(1),16);const r=(n>>16)&255,g=(n>>8)&255,b=n&255;return `rgba(${r},${g},${b},${a})`;}

  sc.addEventListener("mousemove",e=>{const r=sc.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;});
  sc.addEventListener("mouseleave",()=>{mouse.x=mouse.y=-999;});
  sc.addEventListener("click",()=>{if(hover)focusRun(hover.run.id);});

  /* single animation loop */
  let last=0;
  function frame(t){
    drawBg(t);
    drawSwarm(t);
    requestAnimationFrame(frame);
  }

  /* ---------- filters ---------- */
  function passFilter(run){
    if(state.filter!=="all"&&run.state!==state.filter)return false;
    if(state.q){const hay=(run.repo+" "+run.workflow+" "+(run.title||"")+" "+(run.branch||"")).toLowerCase();if(!hay.includes(state.q))return false;}
    return true;
  }

  /* ---------- render feed + HUD numbers ---------- */
  function render(){
    const d=state.data;if(!d)return;
    syncNodes();
    // HUD corner + gauges
    const T=d.totals||{};
    const totalRuns=(d.runs||[]).length;
    $("#hiveSub").textContent="TRACKING "+((d.repos||[]).length)+" SWARMS · "+totalRuns+" RUNS";
    setNum("#cActive",T.running||0);setNum("#cQueued",T.queued||0);setNum("#cFailed",T.failure||0);
    const max=Math.max(1,T.running||0,T.queued||0,T.success||0,T.failure||0,(T.cancelled||0)+(T.other||0));
    gauge("gRun","gRunBar",T.running||0,max);gauge("gQ","gQBar",T.queued||0,max);
    gauge("gOk","gOkBar",T.success||0,max);gauge("gBad","gBadBar",T.failure||0,max);
    gauge("gIdle","gIdleBar",(T.cancelled||0)+(T.other||0),max);
    if(d.rate&&d.rate.remaining!=null)$("#rate").textContent=d.rate.remaining+(d.rate.limit?"/"+d.rate.limit:"");

    // feed grouped by repo
    const feed=$("#feed");
    const byRepo=new Map();
    for(const r of (d.repos||[]))byRepo.set(r.full,{summary:r,runs:[]});
    for(const run of (d.runs||[])){if(!passFilter(run))continue;
      if(!byRepo.has(run.repo))byRepo.set(run.repo,{summary:{full:run.repo,counts:{}},runs:[]});
      byRepo.get(run.repo).runs.push(run);}
    let html="",shown=0;
    for(const[full,grp]of byRepo){
      if(!grp.runs.length&&(state.filter!=="all"||state.q))continue;
      html+=blockHtml(full,grp);shown+=grp.runs.length;
    }
    if(!shown)html=`<div class="empty"><h3>No runs match</h3><p>Clear the filter or launch a workflow.</p></div>`;
    feed.innerHTML=html;
    // load jobs for any expanded rows
    feed.querySelectorAll("[data-jobs-for]").forEach(h=>loadJobs({repo:h.dataset.repo,id:h.dataset.jobsFor},h));
  }
  function setNum(sel,v){$(sel).textContent=v;}
  function gauge(numId,barId,v,max){document.getElementById(numId).textContent=v;document.getElementById(barId).style.width=(max?Math.round(v/max*100):0)+"%";}

  function blockHtml(full,grp){
    const[owner,name]=full.split("/");const c=grp.summary.counts||{};
    let pips="";for(const k of STATES){const n=c[k]||0;for(let i=0;i<Math.min(n,6);i++)pips+=`<span class="pip" style="background:${COL[k]};${k==="running"?"box-shadow:0 0 6px "+COL[k]:""}"></span>`;}
    let rows="";for(const run of grp.runs)rows+=runHtml(run);
    return `<div class="swarm-block"><div class="sb-head"><span class="repo"><span class="owner">${esc(owner)}/</span>${esc(name||"")}</span><span class="pips">${pips}</span><span class="grow"></span>${grp.summary.error?`<span class="err">⚠ ${esc(grp.summary.error)}</span>`:""}</div>${rows}</div>`;
  }

  const IC={
    logs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>',
    stop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>',
    rerun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>',
    chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>'
  };
  function runHtml(run){
    const active=run.state==="running"||run.state==="queued";
    const ended=active?"":run.updated_at;
    const ctrl=active
      ? `<button class="iico stop" data-act="cancel" data-repo="${run.repo}" data-run="${run.id}" title="Cancel">${IC.stop}</button>`
      : `<button class="iico" data-act="${run.state==="failure"?"rerun_failed":"rerun"}" data-repo="${run.repo}" data-run="${run.id}" title="Re-run">${IC.rerun}</button>`;
    const jobs=state.expanded.has(run.id)?`<div class="jobs" data-jobs-for="${run.id}" data-repo="${run.repo}"><div class="step">loading…</div></div>`:"";
    return `<div class="run r-${run.state}" id="run-${run.id}">
      <span class="rail"></span>
      <span class="pill"><span class="d"></span>${LBL[run.state]}</span>
      <div class="rmain">
        <div class="wf">${esc(run.workflow)} <span class="n">#${run.number}${run.attempt>1?"·"+run.attempt:""}</span></div>
        ${run.title?`<div class="t">${esc(run.title)}</div>`:""}
        <div class="meta">⎇ ${esc(run.branch||"—")} · ${esc(run.event||"")}${run.actor?" · @"+esc(run.actor):""}</div>
      </div>
      <div class="racts">
        <span class="dur"><span data-live-start="${active?run.started_at:""}">${durTxt(run.started_at,ended)}</span><div class="rel">${rel(run.updated_at)} ago</div></span>
        <a class="iico" href="${run.url}" target="_blank" rel="noopener" title="Open on GitHub">${IC.logs}</a>
        <button class="iico" data-act="expand" data-run="${run.id}" data-repo="${run.repo}" title="Jobs">${IC.chev}</button>
        ${ctrl}
      </div>
      ${jobs}
    </div>`;
  }

  async function loadJobs(run,holder){
    if(holder.dataset.loaded)return;holder.dataset.loaded="1";
    if(state.demo){holder.innerHTML=demoJobs();return;}
    try{const r=await api(`/api/jobs?repo=${encodeURIComponent(run.repo)}&run_id=${run.id}`);
      if(!r.jobs||!r.jobs.length){holder.innerHTML=`<div class="step">No job data.</div>`;return;}
      holder.innerHTML=r.jobs.map(jobHtml).join("");
    }catch(e){holder.innerHTML=`<div class="step" style="color:var(--red)">${esc(e.message)}</div>`;}
  }
  function jobHtml(j){
    const col=j.conclusion==="success"?"#2FE68A":j.conclusion==="failure"?"#FF3D6E":j.status==="in_progress"?"#29E7FF":"#5D6B8C";
    const steps=(j.steps||[]).map(s=>{const m=s.conclusion==="success"?"✓":s.conclusion==="failure"?"✕":s.status==="in_progress"?"▸":s.status==="queued"?"·":"–";
      const c=s.conclusion==="success"?"#2FE68A":s.conclusion==="failure"?"#FF3D6E":s.status==="in_progress"?"#29E7FF":"#4E5B7E";
      return `<div class="step"><span class="m" style="color:${c}">${m}</span>${esc(s.name)}</div>`;}).join("");
    return `<div class="job"><span style="color:${col}">●</span><span style="color:var(--dim)">${esc(j.name)}</span></div><div class="steps">${steps}</div>`;
  }
  function demoJobs(){return `<div class="job"><span style="color:#29E7FF">●</span><span style="color:var(--dim)">run-agent</span></div><div class="steps">
    <div class="step"><span class="m" style="color:#2FE68A">✓</span>checkout</div>
    <div class="step"><span class="m" style="color:#2FE68A">✓</span>setup python</div>
    <div class="step"><span class="m" style="color:#29E7FF">▸</span>evaluate BTC 1m signal</div>
    <div class="step"><span class="m" style="color:#4E5B7E">·</span>place / manage order</div></div>`;}

  function focusRun(id){
    const card=document.getElementById("run-"+id);
    if(card){card.scrollIntoView({behavior:"smooth",block:"center"});card.classList.remove("flash");void card.offsetWidth;card.classList.add("flash");}
  }

  /* ---------- actions ---------- */
  async function doAction(payload,ok){
    if(state.demo){toast("Demo mode — connect a token to control runs.","err");return;}
    try{const r=await api("/api/action",{method:"POST",body:JSON.stringify(payload)});toast(r.message||ok,"ok");setTimeout(load,900);}
    catch(e){toast(e.message,"err");}
  }

  /* ---------- launch drawer ---------- */
  const drawer=$("#drawer"),scrim=$("#scrim");
  function openDrawer(){const repos=(state.data?.repos||[]).map(r=>r.full);
    $("#dRepo").innerHTML=repos.map(r=>`<option value="${r}">${r}</option>`).join("")||`<option value="">no repos</option>`;
    onRepoPick();drawer.classList.add("open");scrim.classList.add("open");drawer.setAttribute("aria-hidden","false");}
  function closeDrawer(){drawer.classList.remove("open");scrim.classList.remove("open");drawer.setAttribute("aria-hidden","true");}
  async function onRepoPick(){const repo=$("#dRepo").value,wf=$("#dWorkflow");if(!repo)return;wf.innerHTML=`<option>loading…</option>`;
    if(state.demo){wf.innerHTML=`<option>scalp-agent.yml</option><option>backtest.yml</option>`;$("#dRef").value="main";return;}
    try{const r=await api(`/api/workflows?repo=${encodeURIComponent(repo)}`);
      wf.innerHTML=r.workflows.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join("")||`<option value="">none</option>`;
      $("#dRef").value=r.default_branch||"main";
    }catch(e){wf.innerHTML=`<option value="">${esc(e.message)}</option>`;}}
  async function submitLaunch(){const repo=$("#dRepo").value,workflow_id=$("#dWorkflow").value,ref=$("#dRef").value.trim()||"main";
    let inputs={};const raw=$("#dInputs").value.trim();if(raw){try{inputs=JSON.parse(raw);}catch{return toast("Inputs must be valid JSON.","err");}}
    if(!workflow_id)return toast("Pick a workflow.","err");
    ensureAudio();sfxLaunch();
    await doAction({type:"dispatch",repo,workflow_id,ref,inputs},"Launch requested");closeDrawer();}

  /* ---------- toasts ---------- */
  function toast(msg,kind){const t=document.createElement("div");t.className="toast "+(kind||"");t.textContent=msg;$("#toasts").appendChild(t);
    setTimeout(()=>{t.style.opacity="0";t.style.transition="opacity .3s";setTimeout(()=>t.remove(),300);},3200);}

  /* ---------- load ---------- */
  async function load(){
    try{const d=await api("/api/state");state.demo=false;$("#banner").innerHTML="";$("#sysStat").textContent="SYSTEM ONLINE";detectEvents(d);state.data=d;render();}
    catch(e){state.demo=true;state.data=DEMO;$("#sysStat").textContent="DEMO MODE";
      $("#banner").innerHTML=`<div class="banner">◆ DEMO DATA — not connected to GitHub. Deploy + set your token to go live. (${esc(e.message)})</div>`;render();}
  }
  function tick(){document.querySelectorAll("[data-live-start]").forEach(n=>{const s=n.getAttribute("data-live-start");if(s)n.textContent=durTxt(s,null);});}
  function setAuto(on){state.auto=on;$("#autoBtn").classList.toggle("paused",!on);$("#autoLbl").textContent=on?"LIVE·20s":"PAUSED";
    if(poll)clearInterval(poll);if(on)poll=setInterval(()=>{if(!document.hidden)load();},state.ms);}

  /* ---------- wire ---------- */
  $("#refreshBtn").onclick=load;
  $("#autoBtn").onclick=()=>setAuto(!state.auto);
  $("#launchBtn").onclick=openDrawer;
  $("#dClose").onclick=closeDrawer;$("#dCancel").onclick=closeDrawer;$("#scrim").onclick=closeDrawer;
  $("#dRepo").onchange=onRepoPick;$("#dRun").onclick=submitLaunch;
  $("#find").addEventListener("input",e=>{state.q=e.target.value.trim().toLowerCase();render();});
  document.querySelector(".feed-head").addEventListener("click",e=>{const f=e.target.closest(".flt");if(!f)return;
    state.filter=f.dataset.f;document.querySelectorAll(".flt").forEach(x=>x.setAttribute("aria-pressed",x===f?"true":"false"));render();});
  $("#feed").addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;
    const act=b.dataset.act,repo=b.dataset.repo,run=b.dataset.run;
    if(act==="expand"){const id=Number(run)||run;if(state.expanded.has(id))state.expanded.delete(id);else state.expanded.add(id);render();return;}
    if(act==="cancel"){ensureAudio();sfxCancel();doAction({type:"cancel",repo,run_id:Number(run)||run},"Cancel requested");}
    if(act==="rerun")doAction({type:"rerun",repo,run_id:Number(run)||run},"Re-run requested");
    if(act==="rerun_failed")doAction({type:"rerun_failed",repo,run_id:Number(run)||run},"Re-run requested");});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();});
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&state.auto)load();});
  addEventListener("resize",()=>{sizeBg();sizeSwarm();});

  // mute toggle
  const ICO_ON='<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/>';
  const ICO_OFF='<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M23 9l-6 6M17 9l6 6"/>';
  $("#muteBtn").onclick=()=>{muted=!muted;ensureAudio();$("#muteBtn").classList.toggle("muted",muted);$("#muteIco").innerHTML=muted?ICO_OFF:ICO_ON;if(!muted)sfxRunning();};

  // war room (fullscreen swarm)
  function toggleWar(){const on=!document.body.classList.contains("warroom");
    document.body.classList.toggle("warroom",on);
    if(on){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});}
    else{document.fullscreenElement&&document.exitFullscreen&&document.exitFullscreen().catch(()=>{});}
    $("#warBtn").classList.toggle("on",on);
    requestAnimationFrame(()=>{sizeSwarm();});}
  $("#warBtn").onclick=toggleWar;
  document.addEventListener("fullscreenchange",()=>{const fs=!!document.fullscreenElement;
    if(!fs){document.body.classList.remove("warroom");$("#warBtn").classList.remove("on");}
    requestAnimationFrame(sizeSwarm);});

  // unlock audio on first interaction
  document.addEventListener("pointerdown",ensureAudio,{once:true});

  setInterval(()=>{$("#clock").textContent=new Date().toLocaleTimeString([],{hour12:false});},1000);
  setInterval(tick,1000);

  /* ---------- demo dataset ---------- */
  const now=Date.now(),iso=s=>new Date(now-s*1000).toISOString();
  const DEMO={generated_at:new Date().toISOString(),rate:{remaining:4981,limit:5000},
    totals:{running:3,queued:2,success:4,failure:1,cancelled:1,other:0},
    repos:[
      {full:"siphen00/mt5-trading-agent",counts:{running:2,queued:0,success:2,failure:1,cancelled:0,other:0}},
      {full:"siphen00/melago",counts:{running:1,queued:1,success:1,failure:0,cancelled:1,other:0}},
      {full:"siphen00/apex-signals",counts:{running:0,queued:1,success:1,failure:0,cancelled:0,other:0}}],
    runs:[
      {id:1,repo:"siphen00/mt5-trading-agent",workflow:"scalp-agent",title:"liquidity sweep reversal · BTC 1m",number:842,attempt:1,state:"running",event:"schedule",branch:"main",actor:"siphen00",started_at:iso(126),updated_at:iso(2),url:"#"},
      {id:2,repo:"siphen00/mt5-trading-agent",workflow:"veto-check",title:"qwen2.5 trade veto pass",number:841,attempt:1,state:"running",event:"workflow_dispatch",branch:"main",actor:"siphen00",started_at:iso(58),updated_at:iso(1),url:"#"},
      {id:3,repo:"siphen00/melago",workflow:"pwa-build",title:"deploy melago.xyz",number:210,attempt:1,state:"running",event:"push",branch:"main",actor:"siphen00",started_at:iso(40),updated_at:iso(3),url:"#"},
      {id:4,repo:"siphen00/melago",workflow:"e2e",title:"driver flow smoke test",number:209,attempt:1,state:"queued",event:"push",branch:"feat/wallet",actor:"siphen00",started_at:iso(6),updated_at:iso(6),url:"#"},
      {id:5,repo:"siphen00/apex-signals",workflow:"ingest",title:"pull 1m candles",number:77,attempt:1,state:"queued",event:"schedule",branch:"main",actor:"siphen00",started_at:iso(4),updated_at:iso(4),url:"#"},
      {id:6,repo:"siphen00/mt5-trading-agent",workflow:"scalp-agent",title:"volatility squeeze ignition",number:840,attempt:1,state:"failure",event:"schedule",branch:"main",actor:"siphen00",started_at:iso(920),updated_at:iso(760),url:"#"},
      {id:7,repo:"siphen00/mt5-trading-agent",workflow:"backtest",title:"21MA/200MA crossover sweep",number:839,attempt:1,state:"success",event:"workflow_dispatch",branch:"research",actor:"siphen00",started_at:iso(3600),updated_at:iso(3200),url:"#"},
      {id:8,repo:"siphen00/melago",workflow:"lint",title:"eslint + typecheck",number:208,attempt:1,state:"success",event:"push",branch:"main",actor:"siphen00",started_at:iso(5400),updated_at:iso(5300),url:"#"},
      {id:9,repo:"siphen00/apex-signals",workflow:"deploy",title:"ship worker",number:76,attempt:1,state:"success",event:"push",branch:"main",actor:"siphen00",started_at:iso(9000),updated_at:iso(8800),url:"#"},
      {id:10,repo:"siphen00/mt5-trading-agent",workflow:"backtest",title:"exhaustion fade grid",number:838,attempt:1,state:"success",event:"workflow_dispatch",branch:"research",actor:"siphen00",started_at:iso(12000),updated_at:iso(11800),url:"#"},
      {id:11,repo:"siphen00/melago",workflow:"pwa-build",title:"deploy melago.xyz",number:207,attempt:2,state:"cancelled",event:"push",branch:"feat/wallet",actor:"siphen00",started_at:iso(14000),updated_at:iso(13900),url:"#"}]};

  /* ---------- boot ---------- */
  sizeBg();requestAnimationFrame(()=>{sizeSwarm();});
  requestAnimationFrame(frame);
  setAuto(true);
  load();
  const bootTxt=$("#bootTxt"),seq=["INITIALIZING SWARM","LINKING AGENTS","SYNCING TELEMETRY"];let bi=0;
  const bootInt=setInterval(()=>{bi=(bi+1)%seq.length;bootTxt.textContent=seq[bi];},300);
  setTimeout(()=>{clearInterval(bootInt);$("#boot").classList.add("done");sizeSwarm();},RM?0:1050);

  if(!RM)setTimeout(()=>{if(state.demo)triggerAlert();},3200);
})();
